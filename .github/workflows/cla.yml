name: "CLA Assistant"

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant"
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/cla.json'
          path-to-document: 'https://github.com/ToxArch/arcus/blob/main/CLA.md'
          branch: 'cla-signatures'
          allowlist: 'dhanushbs10,bot*,dependabot[bot]'
          custom-notsigned-prcomment: 'Thank you for your pull request! Before we can review or merge your contribution, you must agree to the [ARCUS Contributor License Agreement (CLA)](https://github.com/ToxArch/arcus/blob/main/CLA.md).<br/><br/>To sign the CLA, please reply to this comment with:<br/>```text\nI have read the CLA Document and I hereby sign the CLA\n```'
